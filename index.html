<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bob Acessórios | O Melhor para Você e sua Bike</title>
  <meta name="description" content="Acessórios para ciclistas. Peça direto com o Bob no WhatsApp!">
  <!-- Tailwind CSS CDN para funcionamento 100% autônomo sem Node.js nem build complexo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Header / Barra Superior Responsiva (Mobile & Desktop) -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between py-2.5 sm:py-3 min-h-[72px] sm:min-h-[88px]">
        <!-- Logo e Título com alinhamento flexível e sem sobreposição -->
        <div class="flex items-center gap-3 sm:gap-4 w-full sm:w-auto">
          <img
            src="imagens/logo.png"
            alt="Bob Acessórios Logo"
            class="w-14 h-14 sm:w-20 sm:h-20 max-w-[56px] sm:max-w-[80px] max-h-[56px] sm:max-h-[80px] object-contain shrink-0"
            onerror="if(this.src.indexOf('bob_logo.jpg') === -1) { this.src='bob_logo.jpg'; } else { this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'; }"
          >
          <div id="logo-fallback" class="w-14 h-14 sm:w-20 sm:h-20 text-blue-700 items-center justify-center font-black text-2xl sm:text-3xl shrink-0 hidden">
            🚴
          </div>
          <div class="min-w-0 flex-1">
            <h1 class="text-xl sm:text-2xl md:text-3xl font-black text-slate-900 font-display tracking-tight leading-tight truncate sm:whitespace-normal">
              Bob <span class="text-blue-700">Acessórios</span>
            </h1>
            <p class="text-[11px] sm:text-xs text-slate-500 font-medium truncate sm:whitespace-normal">
              O melhor para você e sua bike!
            </p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Banner Limpo e Direto (Degradê Azul Royal com Preto suave) -->
  <section class="py-8 sm:py-12 bg-gradient-to-b from-blue-50/70 via-slate-100/50 to-slate-50 border-b border-slate-200/80">
    <div class="max-w-3xl mx-auto px-4 text-center">
      <p class="text-slate-800 text-sm sm:text-base md:text-lg font-semibold max-w-xl mx-auto leading-relaxed">
        Sem carrinho nem cadastro. Ao clicar em "pedir pelo Whatsapp", a mensagem vai direto pro Bob!
      </p>

      <!-- Frase em Caixa Alta de Atendimento Regional em Duas Linhas -->
      <div class="mt-5 inline-flex flex-col items-center bg-slate-950 text-blue-300 border border-blue-600/40 px-5 py-2 rounded-2xl shadow-xs">
        <span class="text-[11px] sm:text-xs font-black tracking-widest uppercase text-blue-400">
          ATENDEMOS
        </span>
        <span class="text-xs sm:text-sm font-extrabold tracking-wider uppercase text-white mt-0.5">
          LONDRINA - CAMBÉ - IBIPORÃ
        </span>
      </div>
    </div>
  </section>

  <!-- Catálogo de Produtos em Página Única -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 sm:gap-6">
      <!-- Os produtos serão renderizados automaticamente pelo script abaixo -->
    </div>
  </main>

  <!-- Rodapé (Azul Royal e Preto) -->
  <footer class="bg-gradient-to-r from-blue-950 via-slate-950 to-black text-slate-400 py-8 sm:py-10 mt-12 sm:mt-16 border-t border-slate-800 text-center text-xs">
    <div class="max-w-7xl mx-auto px-4 space-y-2">
      <p class="font-bold text-white text-sm">Bob Acessórios • Acessórios para Ciclistas</p>
      <p>© Bob Acessórios. Pedidos sem burocracia direto no WhatsApp.</p>
    </div>
  </footer>

  <!-- ========================================================================= -->
  <!-- 🚲 TABELA DE PRODUTOS (JSON) & SCRIPT                                     -->
  <!-- Para adicionar, deletar ou alterar produtos, basta mexer na lista abaixo: -->
  <!-- ========================================================================= -->
  <script>
    const WHATSAPP_NUMERO = "5543991492882";

    const PRODUTOS = [
      {
        tag: "BOB-01",
        nome: "Óculos Ciclismo proteção UV400",
        preco: 35.90,
        precoAntigo: 69.90,
        descricao: "Lentes que bloqueiam reflexos solares e vento. Armação leve e anatômica.",
        imagem: "imagens/oculos_vm.jpg",
        badge: "Promoção"
      },
      {
        tag: "BOB-02",
        nome: "Óculos fotocromático SCVCN",
        preco: 49.90,
        descricao: "Óculos com escurecimento automático no sol, uso diurno e noturno.",
        imagem: "imagens/oculos_svcn_preto.jpg",
        badge: "Mais Vendido"
      },
      {
        tag: "BOB-03",
        nome: "Óculos fotocromático SCVCN",
        preco: 49.90,
        descricao: "Óculos com escurecimento automático no sol, uso diurno e noturno.",
        imagem: "imagens/oculos_scvcn_verde.jpg"
      },
      {
        tag: "BOB-04",
        nome: "Luva ciclismo meio dedo reforçada Anti-Impacto",
        preco: 35.00,
        descricao: "Confeccionada com tecido resistente, confortável e respirável.",
        imagem: "imagens/luva_preta.jpg"
      },
      {
        tag: "BOB-05",
        nome: "Luva ciclismo meio dedo reforçada Anti-Impacto",
        preco: 35.00,
        descricao: "Confeccionada com tecido resistente, confortável e respirável.",
        imagem: "imagens/luva_azul.jpg",
        badge: "Essencial"
      },
      {
        tag: "BOB-06",
        nome: "Luva ciclismo meio dedo reforçada",
        preco: 35.00,
        descricao: "Confeccionada com tecido resistente, confortável e respirável.",
        imagem: "imagens/luva_vermelha.jpg"
      },
      {
        tag: "BOB-07",
        nome: "Meia ciclismo NW",
        preco: 20.00,
        descricao: "Meias confortáveis, resistentes e anti-derrapante.",
        imagem: "imagens/meia_NW.jpg"
      },
      {
        tag: "BOB-08",
        nome: "Meia ciclismo GKRQ",
        preco: 20.00,
        descricao: "Meias confortáveis, resistentes e anti-derrapante.",
        imagem: "imagens/meia_GKRQ.jpg"
      },
      {
        tag: "BOB-09",
        nome: "Luz traseira carregamento USB",
        preco: 35.00,
        precoAntigo: 49.00,
        descricao: "100 lúmens de brilho, 5 modos de iluminação, carregamento USB, à prova d´água.",
        imagem: "imagens/pisca.png"
      },
      {
        tag: "BOB-10",
        nome: "Cera lubrificante para corrente de bike 100ml",
        preco: 25.00,
        precoAntigo: 32.00,
        descricao: "Feito para resistir às condições mais exigentes mantendo a corrente limpa, diminuindo ruído e atrito da relação.",
        imagem: "imagens/ceralub.jpeg",
        badge: "Destaque"
      },
      {
        tag: "BOB-11",
        nome: "Cera Premium para corrente de bicicletas 100ml",
        preco: 27.00,
        precoAntigo: 35.00,
        descricao: "Mais performance, proteção avançada, mais durabilidade, alta quilometragem, fácil aplicação.",
        imagem: "imagens/wax.jpeg"
      },
      {
        tag: "BOB-12",
        nome: "Lubrificante de corrente Tec Tire Tec-50 120ml",
        preco: 35.00,
        descricao: "O tec Tite Tec-50 forma uma película macia e resistenteque reduz o desgasteda corrente e proporciona um melhor rendimento.",
        imagem: "imagens/tec50.jpeg"
      }
    ];

    function formatarMoeda(valor) {
      return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function gerarLinkWhats(produto) {
      const tagTexto = produto.tag ? ` (TAG: ${produto.tag})` : '';
      const msg = `Olá Bob! Gostaria de pedir o acessório "${produto.nome}"${tagTexto} por ${formatarMoeda(produto.preco)} que vi no catálogo. Está disponível?`;
      return `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(msg)}`;
    }

    function renderizarProdutos() {
      const grid = document.getElementById("grid-produtos");
      if (!grid) return;

      if (PRODUTOS.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
            <p class="font-bold text-slate-700">Nenhum acessório cadastrado no momento.</p>
            <p class="text-xs text-slate-500 mt-1">Volte em breve para conferir as novidades!</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = PRODUTOS.map(p => `
        <article class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-xl transition flex flex-col justify-between">
          <!-- Foto do produto 100% limpa (sem etiqueta de TAG por cima) -->
          <div class="relative aspect-4/3 bg-slate-100 overflow-hidden">
            <img
              src="${p.imagem}"
              alt="${p.nome}"
              class="w-full h-full object-cover"
              onerror="this.src='https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=800&auto=format&fit=crop&q=80'"
            >
            ${p.badge ? `
              <div class="absolute top-3 left-3">
                <span class="bg-blue-700 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-md shadow-xs">${p.badge}</span>
              </div>
            ` : ''}
          </div>

          <!-- Corpo do card -->
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-slate-900 text-base leading-snug">${p.nome}</h3>
              <p class="text-xs text-slate-600 mt-1.5 line-clamp-3 leading-relaxed">${p.descricao || ''}</p>
            </div>

            <!-- Etiqueta com a informação da TAG centralizada entre a descrição e o preço -->
            <div class="my-3 flex justify-center">
              <span class="inline-flex items-center gap-1 bg-slate-900 text-blue-300 text-xs font-black px-3 py-1 rounded-lg border border-blue-400/30 shadow-xs font-mono tracking-wide">
                ${p.tag ? `TAG: ${p.tag}` : 'TAG: SOB CONSULTA'}
              </span>
            </div>

            <!-- Bloco de Preço e Botão WhatsApp -->
            <div class="pt-3 border-t border-slate-100">
              <div class="flex items-baseline justify-between mb-2.5">
                <div>
                  ${p.precoAntigo ? `<span class="text-xs text-slate-400 line-through mr-1">${formatarMoeda(p.precoAntigo)}</span>` : ''}
                  <span class="text-xl font-black text-slate-900">${formatarMoeda(p.preco)}</span>
                </div>
                <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">Em Estoque</span>
              </div>
              <a
                href="${gerarLinkWhats(p)}"
                target="_blank"
                rel="noopener noreferrer"
                class="w-full inline-flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs py-2.5 px-4 rounded-xl shadow-xs transition"
              >
                <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.007c.106.005.249-.04.39.299.144.347.491 1.2.534 1.288.043.088.072.19.014.305-.058.115-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86.173.086.275.072.376-.044.101-.116.433-.506.549-.68.116-.173.231-.144.39-.086.159.058 1.011.477 1.184.564.173.087.289.13.332.202.043.072.043.419-.101.824z"/></svg>
                <span>Pedir pelo WhatsApp</span>
              </a>
            </div>
          </div>
        </article>
      `).join("");
    }

    // Carrega os produtos assim que a página abre
    renderizarProdutos();
  </script>
</body>
</html>
